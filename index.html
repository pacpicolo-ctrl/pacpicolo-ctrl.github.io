      h+=`<button class="d${k==tk?' t':''}${k>tk||k<st?' f':''}" data-d="${k}" style="--q:${((pts(k)/100)**1.5).toFixed(3)};--i:${d}"><span class="n">${d}</span>${k>tk||k<st?'':'<u class="lq"></u>'}${dot('d:'+k)}</button>`;
    }
  }
  $('#cal').innerHTML=h+'</div>';
  const mk=y+'-'+pad(m+1),sl=SL[S.lang]||SL.fr;
  $('#sm').innerHTML=[[sl.m,sc(new Date(y,m,1),new Date(y,m,nd))],[sl.y,sc(new Date(y,0,1),new Date(y,11,31))]].map(([t,v])=>`<div class="st"><span>${t}</span><b>${v??'–'}</b>/100</div>`).join('');
  $('#nt').innerHTML=`<button class="c" data-n="m:${mk}">${l.mn}${dot('m:'+mk)}</button><button class="c" data-n="y:${y}">${l.yn}${dot('y:'+y)}</button>`;
  {let s0=0,n0=0;const a0=ST(),b0=TD();for(let d=1;d<=nd;d++){const k=dk(y,m,d);if(k>=a0&&k<=b0){s0+=1-Math.pow(pts(k)/100,1.5);n0++}}document.documentElement.style.setProperty('--vi',(n0?s0/n0:0).toFixed(3))}
}
function fill(){
  const l=L(),t=cur[0],k=cur.slice(2);let sub=k;
  if(t=='d'){const[a,b,c]=k.split('-');sub=new Intl.DateTimeFormat(S.lang,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(a,b-1,c))}
  if(t=='m'){const[a,b]=k.split('-');sub=new Intl.DateTimeFormat(S.lang,{month:'long',year:'numeric'}).format(new Date(a,b-1,1))}
  const P=k.split(/-W?/).map(Number);let v=null;
  if(t=='w'){const j=new Date(P[0],0,4),q=4-(j.getDay()+6)%7+7*(P[1]-1);v=sc(new Date(P[0],0,q),new Date(P[0],0,q+6))}
  if(t=='m')v=sc(new Date(P[0],P[1]-1,1),new Date(P[0],P[1],0));
  if(t=='y')v=sc(new Date(P[0],0,1),new Date(P[0],11,31));
  let h=`<div class="in"><div class="hd"><div><h2>${l[t+'n']}</h2><p>${sub}</p></div><button class="c" data-x="1">${l.cl}</button></div>`;
  if(t=='d'){
    const n=cnt(k);
    h+=`<div class="pr"><div class="bar"><span id="pb" style="width:${n/(HL().length||1)*100}%"></span></div><b id="pc">${n}/${HL().length}</b></div>${k!=TD()?`<p class="lk">${({fr:'🔒 Seul aujourd’hui peut être modifié',en:'🔒 Only today can be edited',es:'🔒 Solo se puede modificar hoy'})[S.lang]}</p>`:''}`
    +HL().map(i=>ED?`<div class="r"><input class="ei" data-e="${i}" value="${esc(ic(i))}" maxlength="4"${LK(i)?' disabled':''}><input class="nm" data-r="${i}" value="${esc(hn(i))}"${LK(i)?' disabled':''}><input class="wt" type="number" inputmode="numeric" min="0" max="100" data-wt="${i}" value="${wt(i)}" aria-label="pts"${LK(i)?' disabled':''}><small>pts</small><span class="g2"><small>🎯</small><input class="gt" type="number" inputmode="numeric" min="1" data-gt="${i}" value="${GL(i)?GL(i).t:''}" placeholder="—" aria-label="objectif"><small>×</small></span><button class="c dl${PD===i?' on':''}" data-del="${i}"${LK(i)?' disabled':''}>${LK(i)?'🔒':PD===i?({fr:'Supprimer ?',en:'Delete?',es:'¿Borrar?'})[S.lang]:'🗑'}</button></div>`
      :`<label class="r"><input type="checkbox" data-i="${i}"${(S.d[k]||0)>>i&1?' checked':''}${k!=TD()?' disabled':''}><em>${esc(ic(i))}</em><span>${esc(hn(i))}</span>${CN(i)}</label>`).join('')
    +`<button class="c ed" data-ed="1">${ED?'✓ OK':'✏️ '+l.ed}</button><button class="c ed" data-add="1">${PRM()?'+':'🔒'} ${({fr:'Ajouter un objectif',en:'Add a goal',es:'Añadir objetivo'})[S.lang]}</button>`;
  }
  sh.innerHTML=h+(t=='d'?'':`<p class="lk">${(SL[S.lang]||SL.fr)[t]} : <b>${v??'–'}</b>/100</p>`)+`<textarea id="ta" placeholder="${l.ph}">${esc(S.n[cur]||'')}</textarea></div>`;
}
function op(key){cur=key;ED=0;PD=-1;fill();sh.showModal()}
document.addEventListener('click',e=>{
  const bt=e.target.closest('button');if(!bt)return;const D=bt.dataset;
  if(D.y){V.y=+D.y;render()}
  
  else if(D.m){V.m=+D.m;render()}
  else if(D.d)op('d:'+D.d);
  else if(D.w)op('w:'+D.w);
  else if(D.n)op(D.n);
  else if(D.pay){paywall()}
  else if(D.buy){buy()}
  else if(D.rst){restore()}
  else if(D.add){if(!PRM()){paywall();return}const id=S.nx||12;if(id>30)return;S.h=[...HL(),id];S.nx=id+1;S.names[id]=({fr:'Nouvel objectif',en:'New goal',es:'Nuevo objetivo'})[S.lang];ED=1;PD=-1;save();render();fill();const x=sh.querySelector('[data-r="'+id+'"]');if(x){x.focus();x.select()}}
  else if(D.del){const i=+D.del;if(LK(i))return;if(PD===i){S.h=HL().filter(j=>j!==i);PD=-1;save();render();fill()}else{PD=i;fill()}}
  else if(D.ed){ED=!ED;PD=-1;fill()}
  else if(D.x)sh.close();
});
sh.addEventListener('click',e=>{if(e.target===sh)sh.close()});
document.addEventListener('change',e=>{
  if(e.target.dataset.pg!=null){setPG(e.target);return}if(e.target.dataset.gt!=null){setGoal(e.target);return}const i=e.target.dataset.i;if(i==null)return;
  const k=cur.slice(2);if(k!=TD()){e.target.checked=!e.target.checked;return}S.d[k]=(S.d[k]||0)^(1<<+i);
  const n=cnt(k);$('#pb').style.width=n/(HL().length||1)*100+'%';$('#pc').textContent=n+'/'+HL().length;save();render();afterTick(e.target,+i);
});
document.addEventListener('input',e=>{
  const t=e.target;
  const q=t.dataset.r??t.dataset.e??t.dataset.wt;if(q!=null&&LK(+q))return;
  if(t.id=='ta'){if(t.value.trim())S.n[cur]=t.value;else delete S.n[cur];save();render()}
  else if(t.dataset.wt!=null){(S.w=S.w||{})[t.dataset.wt]=Math.max(0,Math.min(100,+t.value||0));save();render();}
  else if(t.dataset.e!=null){const v=t.value.trim();S.ic=S.ic||{};if(v)S.ic[t.dataset.e]=v;else delete S.ic[t.dataset.e];save()}
  else if(t.dataset.r!=null){const v=t.value.trim();if(v)S.names[t.dataset.r]=v;else delete S.names[t.dataset.r];save()}
});
$('#lg').onchange=e=>{S.lang=e.target.value;save();render()};
const CL=$('#cal'),IOS=/iP(hone|ad|od)/.test(navigator.userAgent);let A=0,Vl=0,TG=0,TS=0,AX=0,AY=0,GOT=0,PA=99,PB=99,PW=0,B=0,Vv=0,T0=0,LX=null;
function tick(t){
  const dt=Math.min(.04,(t-T0)/1e3||.016);T0=t;
  if(GOT){const m=Math.hypot(AX,AY),r=Math.atan2(AX,Math.abs(AY))*57.3*Math.max(0,Math.min(1,(m-2)/3));TG=Math.max(-40,Math.min(40,r))}
  TS+=(TG-TS)*Math.min(1,dt*16);
  Vl=Math.max(-400,Math.min(400,Vl+(220*(TS-A)-12*Vl)*dt));
  A=Math.max(-45,Math.min(45,A+Vl*dt));
  Vv=Math.max(-9,Math.min(9,Vv+((Math.abs(TS-B)>1.5?3*(TS-B):0)-9*Vv)*dt));B=Math.max(-45,Math.min(45,B+Vv*dt));
  if(Math.abs(A-PA)+Math.abs(B-PB)>.02){CL.style.setProperty('--aw',A.toFixed(2)+'deg');CL.style.setProperty('--av',B.toFixed(2)+'deg');PA=A;PB=B}
  const w=.7+Math.min(1,Math.abs(Vl)/150);if(Math.abs(w-PW)>.02){CL.style.setProperty('--s',w.toFixed(2));PW=w}
  requestAnimationFrame(tick)
}
function listen(){
  
  addEventListener('devicemotion',e=>{const g=e.accelerationIncludingGravity;if(g&&g.x!=null&&g.y!=null){const s=IOS?-1:1;AX=g.x*s;AY=g.y*s;GOT=1}});
}
CL.addEventListener('pointerdown',e=>{LX=e.clientX});
CL.addEventListener('pointermove',e=>{if(LX!=null){Vl+=(e.clientX-LX)*2;Vv+=(e.clientX-LX)*.5;LX=e.clientX}});
addEventListener('pointerup',()=>{LX=null});
addEventListener('pointercancel',()=>{LX=null});
const DM=window.DeviceMotionEvent;
if(DM&&typeof DM.requestPermission=='function')addEventListener('click',()=>{DM.requestPermission().then(s=>{if(s=='granted')listen()}).catch(()=>{})},{once:true});else listen();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick);
const SKU='premium',VERIFY_URL='',DEV=false;/* VERIFY_URL : adresse de ton serveur de vérification (voir LISEZMOI) ; DEV=true pour tester sans payer avec ?dev=1 */
const PRM=()=>S.pr===1||(DEV&&/[?&]dev=1/.test(location.search));
const PT={fr:{t:'Premium',s:'Achat unique, pour toujours',f:['Objectifs en plus des 12 de départ','Objectifs verrouillés avec compteur (ex. 5/50)','Jours parfaits et célébrations'],b:'Débloquer',r:'Restaurer mon achat',n:'Achat indisponible ici : installe l’appli depuis Google Play.',ok:'Premium débloqué !',ko:'Achat non confirmé.'},en:{t:'Premium',s:'One-time purchase, forever',f:['Goals beyond the original 12','Locked goals with a counter (e.g. 5/50)','Perfect days and celebrations'],b:'Unlock',r:'Restore my purchase',n:'Purchase unavailable here: install the app from Google Play.',ok:'Premium unlocked!',ko:'Purchase not confirmed.'},es:{t:'Premium',s:'Compra única, para siempre',f:['Objetivos además de los 12 iniciales','Objetivos bloqueados con contador (ej. 5/50)','Días perfectos y celebraciones'],b:'Desbloquear',r:'Restaurar mi compra',n:'Compra no disponible aquí: instala la app desde Google Play.',ok:'¡Premium desbloqueado!',ko:'Compra no confirmada.'}};
const TX=()=>PT[S.lang]||PT.fr;
async function gds(){try{if(window.getDigitalGoodsService)return await window.getDigitalGoodsService('https://play.google.com/billing')}catch(e){}return null}
async function verify(token){if(!VERIFY_URL)return false;try{const r=await fetch(VERIFY_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sku:SKU,token})});return r.ok&&(await r.json()).ok===true}catch(e){return false}}
function unlock(){S.pr=1;save();sh.close();render();alert(TX().ok)}
async function paywall(){const s=await gds(),t=TX();let p='';try{if(s){const[d]=await s.getDetails([SKU]);p=new Intl.NumberFormat(navigator.language,{style:'currency',currency:d.price.currency}).format(d.price.value)}}catch(e){}
  sh.innerHTML=`<div class="in"><div class="hd"><div><h2>⭐ ${t.t}</h2><p>${t.s}</p></div><button class="c" data-x="1">${L().cl}</button></div>${t.f.map(x=>`<div class="r"><span>✓ ${x}</span></div>`).join('')}<button class="c ed" data-buy="1">${t.b}${p?' '+p:''}</button><button class="c ed" data-rst="1">${t.r}</button></div>`;if(!sh.open)sh.showModal()}
async function buy(){const s=await gds();if(!s){alert(TX().n);return}try{const rq=new PaymentRequest([{supportedMethods:'https://play.google.com/billing',data:{sku:SKU}}],{total:{label:'Total',amount:{currency:'USD',value:'0'}}}),r=await rq.show();if(await verify(r.details.purchaseToken)){await r.complete('success');unlock()}else{await r.complete('fail');alert(TX().ko)}}catch(e){}}
async function restore(){const s=await gds();if(!s){alert(TX().n);return}try{for(const p of await s.listPurchases())if(p.itemId===SKU&&await verify(p.purchaseToken)){unlock();return}alert(TX().ko)}catch(e){alert(TX().ko)}}
(async()=>{if(S.pr)return;const s=await gds();if(!s)return;try{for(const p of await s.listPurchases())if(p.itemId===SKU&&await verify(p.purchaseToken)){S.pr=1;save();render();return}}catch(e){}})();
render();
{const x=$('#ms .on');if(x)x.scrollIntoView({inline:'center',block:'nearest'})}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
